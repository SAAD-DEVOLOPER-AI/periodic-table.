<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Periodic Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    text-align: center;
    padding: 25px 10px;
    background: #111827;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: #94a3b8;
}

.controls {
    text-align: center;
    padding: 20px;
}

#search {
    width: 320px;
    max-width: 90%;
    padding: 13px 18px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

.table-container {
    overflow-x: auto;
    padding: 20px;
}

.periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 70px);
    grid-template-rows: repeat(10, 85px);
    gap: 5px;
    width: max-content;
    margin: auto;
}

.element {
    position: relative;
    border-radius: 8px;
    padding: 5px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(255,255,255,0.2);
}

.element:hover {
    transform: scale(1.08);
    z-index: 5;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
}

.number {
    font-size: 10px;
    text-align: left;
}

.symbol {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

.name {
    font-size: 9px;
    margin-top: 3px;
}

.mass {
    font-size: 8px;
    margin-top: 2px;
}

/* Element categories */

.alkali {
    background: #ef4444;
}

.alkaline {
    background: #f97316;
}

.transition {
    background: #eab308;
    color: #111;
}

.post-transition {
    background: #84cc16;
    color: #111;
}

.metalloid {
    background: #14b8a6;
}

.nonmetal {
    background: #06b6d4;
}

.halogen {
    background: #3b82f6;
}

.noble {
    background: #8b5cf6;
}

.lanthanide {
    background: #ec4899;
}

.actinide {
    background: #f43f5e;
}

.unknown {
    background: #64748b;
}

/* Modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal-content {
    width: 400px;
    max-width: 90%;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

.close {
    float: right;
    font-size: 25px;
    cursor: pointer;
}

.modal-symbol {
    font-size: 70px;
    font-weight: bold;
}

.modal h2 {
    margin-bottom: 5px;
}

.info {
    margin-top: 20px;
    line-height: 1.8;
}

.legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px;
}

.legend span {
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>⚛ Advanced Periodic Table</h1>
    <p>Interactive Periodic Table of the Elements</p>
</header>

<div class="controls">
    <input
        type="text"
        id="search"
        placeholder="🔎 Search element, symbol or atomic number..."
        oninput="searchElements()"
    >
</div>

<div class="table-container">
    <div class="periodic-table" id="table"></div>
</div>

<div class="legend">
    <span class="alkali">Alkali Metal</span>
    <span class="alkaline">Alkaline Earth</span>
    <span class="transition">Transition Metal</span>
    <span class="post-transition">Post-transition</span>
    <span class="metalloid">Metalloid</span>
    <span class="nonmetal">Nonmetal</span>
    <span class="halogen">Halogen</span>
    <span class="noble">Noble Gas</span>
    <span class="lanthanide">Lanthanide</span>
    <span class="actinide">Actinide</span>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>

        <div class="modal-symbol" id="modalSymbol"></div>
        <h2 id="modalName"></h2>

        <div class="info">
            <b>Atomic Number:</b> <span id="modalNumber"></span><br>
            <b>Atomic Mass:</b> <span id="modalMass"></span><br>
            <b>Category:</b> <span id="modalCategory"></span><br>
            <b>Period:</b> <span id="modalPeriod"></span><br>

const table = document.getElementById("table");

function createTable(data = elements) {

    table.innerHTML = "";

    data.forEach(el => {

        const [number, symbol, name, mass, category, row, col] = el;

        const div = document.createElement("div");

        div.className = `element ${category}`;

        div.style.gridRow = row;
        div.style.gridColumn = col;

        div.innerHTML = `
            <div class="number">${number}</div>
            <div class="symbol">${symbol}</div>
            <div class="name">${name}</div>
            <div class="mass">${mass}</div>
        `;

        div.onclick = () => showElement(el);

        table.appendChild(div);
    });
}

function showElement(el) {

    const [number, symbol, name, mass, category, period, group] = el;

    document.getElementById("modalSymbol").textContent = symbol;
    document.getElementById("modalName").textContent = name;
    document.getElementById("modalNumber").textContent = number;
    document.getElementById("modalMass").textContent = mass;
    document.getElementById("modalCategory").textContent = category;
    document.getElementById("modalPeriod").textContent = period;
    document.getElementById("modalGroup").textContent = group;

    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function searchElements() {

    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered = elements.filter(el => {

        const number = el[0].toString();
        const symbol = el[1].toLowerCase();
        const name = el[2].toLowerCase();

        return (
            number.includes(search) ||
            symbol.includes(search) ||
            name.includes(search)
        );
    });

    createTable(filtered);
}

window.onclick = function(event) {

    const modal = document.getElementById("modal");

    if (event.target === modal) {
        closeModal();
    }
};

createTable();
